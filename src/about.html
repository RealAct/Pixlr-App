<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src file:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>About Pixlr Desktop</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: #f4f1ff; text-align: center;
    background:
      radial-gradient(circle at 20% 10%, rgba(255, 138, 76, .45), transparent 55%),
      radial-gradient(circle at 85% 90%, rgba(48, 120, 255, .45), transparent 55%),
      linear-gradient(160deg, #3a1550, #1a1530 60%, #101a3a);
    -webkit-user-select: none; user-select: none;
  }
  img { width: 128px; height: 128px; filter: drop-shadow(0 10px 24px rgba(0, 0, 0, .35)); }
  h1 {
    margin: 4px 0 0; font-size: 22px; font-weight: 700; letter-spacing: -.01em;
    background: linear-gradient(90deg, #ff9a5a, #f6408c 45%, #8b48f6 75%, #4aa3ff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .version { color: #b9b0d6; font-size: 12px; }
  .by { margin-top: 14px; font-size: 14px; }
  .by strong { font-weight: 600; }
  a {
    display: inline-block; margin-top: 4px; padding: 6px 16px; border-radius: 999px;
    color: #fff; text-decoration: none; font-weight: 600;
    background: linear-gradient(90deg, #f6408c, #8b48f6);
    box-shadow: 0 6px 18px rgba(246, 64, 140, .35);
  }
  a:hover { filter: brightness(1.1); }
  a:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .fine { margin-top: 18px; max-width: 300px; color: #8f87ad; font-size: 11px; }
</style>
</head>
<body>
  <img src="../build/icon.png" alt="">
  <h1>Pixlr Desktop</h1>
  <div class="version" id="version"></div>
  <div class="by">Created by <strong>Eli Linares</strong></div>
  <a href="https://realact.net">realact.net</a>
  <div class="fine">Unofficial desktop client for pixlr.com. Pixlr is a trademark of its owner.</div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('version').textContent =
    `Version ${q.get('version') || ''} · Electron ${q.get('electron') || ''} · Chromium ${(q.get('chrome') || '').split('.')[0]}`;
</script>
</body>
</html>
